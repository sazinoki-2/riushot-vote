<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Vote</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="container">
            <!-- Header -->
            <header>
                <div class="branding">
                    <img src="RDGTaikon.png" alt="Logo" class="site-logo">
                    <h1>RIUDAO GOVERNANCE</h1>
                </div>

                <div class="wallet-container">
                    <div id="wallet-stats" class="wallet-stats">
                        <span id="wallet-address" class="wallet-address"></span>
                        <span id="wallet-balance" class="wallet-balance"></span>
                    </div>
                    <button id="connect-btn" class="btn btn-primary" onclick="connectWallet()">Connect Wallet</button>
                </div>
            </header>

            <!-- Controls -->
            <div class="controls-bar">
                <div>
                    <h2 style="font-size:18px; font-weight:500; display:flex; align-items:center; gap:10px;">
                        投票一覧
                        <span
                            style="font-size:11px; color:var(--text-secondary); font-weight:normal; border:1px solid var(--border-color); padding:4px 8px; border-radius:4px; display:inline-flex; align-items:center; gap:5px; background:var(--card-bg);">
                            <span title="成立条件">✅ 成立条件:</span>
                            <span>🗳️ 50,000 RDGT以上</span>
                            <span style="color:var(--border-color)">|</span>
                            <span>👤 5ウォレット以上</span>
                        </span>
                    </h2>
                </div>
                <button id="create-btn" class="btn btn-primary" onclick="openModal()" disabled>+ Create
                    Proposal</button>
            </div>

            <!-- Proposals List -->
            <div id="proposals-container">
                <!-- Injected by JS -->
            </div>

        </div>

        <!-- Create Modal -->
        <div id="create-modal" class="modal-overlay">
            <div class="modal">
                <h3 class="modal-title">提案を作成</h3>

                <div class="form-group">
                    <label>タイトル <span id="title-counter"
                            style="color: var(--text-secondary); font-size: 12px;">(0/30)</span></label>
                    <input type="text" id="p-title" class="form-input" placeholder="例：報酬プールの増額案について（30文字以内）"
                        maxlength="30">
                </div>

                <div class="form-group">
                    <label>提案内容 <span id="desc-counter"
                            style="color: var(--text-secondary); font-size: 12px;">(0/140)</span></label>
                    <textarea id="p-desc" class="form-textarea" placeholder="提案の理由や詳細をここに書いてください。（140文字以内）"
                        maxlength="140"></textarea>
                </div>

                <div class="form-group" style="margin-top: 10px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px;">
                        <input type="checkbox" id="terms-checkbox" onchange="updateSubmitBtn()">
                        私は<a href="https://yukineriu.online/riudao-governance-legaltxt/" target="_blank" rel="noopener noreferrer" style="color: var(--accent-color); text-decoration: underline;">利用規約</a>に同意する
                    </label>
                </div>

                <div class="modal-actions">
                    <button class="btn" onclick="closeModal()">キャンセル</button>
                    <button id="submit-proposal-btn" class="btn btn-primary"
                        onclick="handleSubmitProposal()">公開</button>
                </div>
            </div>
        </div>


        <script type="module" src="script.js"></script>
</body>

</html>
